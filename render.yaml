services:
  - type: web
    name: fitness-tracker-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitness-tracker-db
          property: connectionString
      - key: IOS_BUNDLE_ID
        value: com.ematobi.fitnesstracker

databases:
  - name: fitness-tracker-db
    plan: free
